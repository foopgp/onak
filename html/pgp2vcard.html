<link rel="icon" href="/favicon.ico" type="image/x-icon">
<!-- Milligram CSS via the Debian package libjs-milligram (Suggests).
     The /javascript/ alias is provided by the javascript-common package. -->
<link rel="stylesheet" href="/javascript/milligram/milligram.min.css">
<!-- OpenPGP.js v6 needs a secure context (WebCrypto crypto.subtle): over plain
     http — e.g. the historic HKP port 11371 — its UMD throws at load ("The
     WebCrypto API is not available") and `openpgp` never gets defined. Hop to
     the standard https origin (same path + query) before fetching 400 kB for
     nothing. localhost is a secure context, so local testing is unaffected. -->
<script>
if (!window.isSecureContext && location.protocol === "http:")
  location.replace("https://" + location.hostname + location.pathname + location.search);
</script>
<!-- OpenPGP.js is vendored (no Debian package exists, unlike libjs-milligram).
     v6.3.1, LGPL, browser UMD global build (window.openpgp). -->
<script src="openpgp.min.js"></script>

  form          { margin-bottom: 1.5rem; }

  .msg-warn     { background: #fff3cd; }
  .msg-err      { background: #f8d7da; }
  .msg-ok       { background: #d4edda; }
  .row-btns     { display: flex; gap: 1rem; flex-wrap: wrap; }

  .chk-line     { display: flex; align-items: center; gap: .4rem; }
  .chk-line label { display: inline; font-weight: normal; margin: 0; }
  .chk-line input { margin: 0; width: auto; }
  .site-footer  { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid #ddd;
                  text-align: center; font-size: .85em; }
  @media (min-width: 1200px) { .container { max-width: 110rem; } }
  @media (max-width: 600px)  { body { font-size: 1.4em; } h1 { font-size: 2.2rem; } h2 { font-size: 1.7rem; } .container { padding: 0 1rem; } }

    // vCard-uid process ; the legacy "Name <email>" uids are kept for the web
    // of trust but their name/email only fill in for a cert not yet upgraded.
    // Mixing them would let a legacy name win over the real FN:, and a revoked
    // EMAIL: whose legacy uid still lives resurface as a duplicate address.
    var fnames = [], vemails = [], lnames = [], lemails = [], eids = {}, extra = [];
    uids.forEach(function (u) {
      var raw = u.userID.userID || "";
      var m = EID_RE.exec(raw);                                  // eid may sit in any uid shape
      if (m) eids["u" + (m[1] || m[3]) + "=" + (m[2] || m[4])] = true;
      // Route FN/EMAIL through the usual paths, carry the other known vCard
      // properties through verbatim, else fall back to classic "Name <email>".
      var pm = PROP_RE.exec(raw), P = pm ? pm[1].toUpperCase() : "";
      if (P === "UID") return;                                   // the eid uid — captured above
      if (P === "FN") { if (pm[3]) fnames.push(pm[3]); return; }
      if (P === "EMAIL") { var e = pm[3].replace(/^<([\s\S]*)>$/, "$1").trim(); if (e) vemails.push(e); return; }
      if (CARRY[P]) { extra.push(P + pm[2] + ":" + pm[3]); return; }
      if (u.userID.name) lnames.push(u.userID.name);
      if (u.userID.email) lemails.push(u.userID.email);
    });
    var names = fnames.length ? fnames : lnames;      // vCard FN: wins over legacy names
    var emails = vemails.length ? vemails : lemails;  // vCard EMAIL: wins over legacy addresses
    var eidList = Object.keys(eids);
    var fn = names[0] || (emails[0] ? emails[0].split("@")[0] : label);
    if (!emails.length) warns.push({ t: "warn", m: t("m_noemail").replace("%f", label) });

    // properties
    var props = [["fn", fn]];
    // UID only with exactly one OpenPGP-ID ; 0 or ≥2 → omitted (flagged red).
    // KIND and GEO are inferred from the eid variant: u4 is a human birth
    // identity → KIND:individual ; u5 is "apparition of anything" → no KIND
    // guess (the property is optional), but its coord14 suffix ("e" + lat +
    // lon, "_" = positive / "-" = negative) yields a GEO. Signed vCard
    // extensions carried in the UAT metadata (planned) will override these
    // inferred properties.
    if (eidList.length === 1) {
      var eid = eidList[0];
      props.push(["uid", "urn:eid:" + eid.replace("=", "")]);   // standard glued form: urn:eid:u4VALUE
      if (eid.slice(0, 2) === "u4") props.push(["kind", "individual"]);
      else {
        var g = /e([_-])([0-9]{2}\.[0-9]{2})([_-])([01][0-9]{2}\.[0-9]{2})$/.exec(eid);
        if (g) props.push(["geo", "geo:" + (g[1] === "-" ? "-" : "") + Number(g[2]) +
                                     "," + (g[3] === "-" ? "-" : "") + Number(g[4])]);
      }
    }
    else if (eidList.length === 0) warns.push({ t: "err", m: t("m_noeid").replace("%f", label) });
    else warns.push({ t: "err", m: t("m_multieid").replace("%f", label).replace("%n", eidList.length) });
    emails.forEach(function (e, i) { props.push(["email", e, i + 1]); });
    extra.forEach(function (line) { props.push(["vcardline", line]); });   // NOTE/ADR/TEL/URL/LANG/GEO… carried from the cert

    // KEY inline: minimised cert (no UAT, no third-party sigs). The photo, if any,
    // goes to PHOTO below — no duplication.
    props.push(["key", "data:application/pgp-keys;base64," + b64(minimalCert(key))]);

    // KEY server link: the retrievable cert, emitted only when reachable (HTTP 200).
    // Cross-origin needs CORS on the keyserver ; degrades gracefully (skipped) when
    // offline or served off-site. NOTE: op=get returns the key (matches
    // MEDIATYPE=application/pgp-keys) ; op=index would return an HTML page instead.
    try {
      var ksUrl = "https://keys.foopgp.org/pks/lookup?op=get&search=0x" + key.getFingerprint();
      var ctrl = new AbortController(); setTimeout(function () { ctrl.abort(); }, 4000);
      var resp = await fetch(ksUrl, { signal: ctrl.signal });
      if (resp.ok) props.push(["keyserver", ksUrl]);
    } catch (e) { /* offline / CORS / 404 → skip */ }

    // PHOTO from non-revoked UAT
    key.users.filter(function (u) { return u.userAttribute && !isRevokedUser(u); }).forEach(function (u) {
      uatJpegs(u.userAttribute).forEach(function (jpeg) {
        props.push(["photo", "data:image/jpeg;base64," + b64(jpeg)]);
      });
    });

    // vCard text
    var lines = ["BEGIN:VCARD", "VERSION:4.0"];
    props.forEach(function (p) {
      var name = p[0].toUpperCase();
      if (p[0] === "email" && p[2]) name = "EMAIL;PREF=" + p[2];
      if (p[0] === "keyserver") lines.push(vLineRaw("KEY;MEDIATYPE=application/pgp-keys", p[1]));
      else if (p[0] === "vcardline") lines.push(vFold(p[1]));   // already a complete, escaped vCard line
      else if (p[0] === "key" || p[0] === "photo" || p[0] === "geo") lines.push(vLineRaw(name, p[1]));   // URI values (data:, geo:) — don't escape the comma
      else lines.push(vLine(name, p[1]));
    });
    lines.push("END:VCARD");

    // jCard (RFC 7095)
    var jc = ["vcard", [["version", {}, "text", "4.0"]]];
    props.forEach(function (p) {
      if (p[0] === "email" && p[2]) jc[1].push(["email", { pref: String(p[2]) }, "text", p[1]]);
      else if (p[0] === "vcardline") jc[1].push(vLineToJcard(p[1]));
      else if (p[0] === "uid") jc[1].push(["uid", {}, "uri", p[1]]);
      else if (p[0] === "keyserver") jc[1].push(["key", { mediatype: "application/pgp-keys" }, "uri", p[1]]);
      else if (p[0] === "key" || p[0] === "photo" || p[0] === "geo") jc[1].push([p[0], {}, "uri", p[1]]);
      else if (p[0] === "kind") jc[1].push(["kind", {}, "text", p[1]]);
      else jc[1].push([p[0], {}, "text", p[1]]);
    });
    return { lines: lines, warns: warns, jcard: jc };
  }

  /* ---- read certificate(s) from textarea or file ----------------------- */
  async function readCerts() {
    var f = document.getElementById("certfile").files[0];
    if (f) {
      var buf = new Uint8Array(await f.arrayBuffer());
      var head = String.fromCharCode.apply(null, buf.slice(0, 30));
      if (head.indexOf("-----BEGIN") >= 0)
        return openpgp.readKeys({ armoredKeys: new TextDecoder().decode(buf) });
      return openpgp.readKeys({ binaryKeys: buf });
    }
    var txt = document.getElementById("certtext").value.trim();
    if (!txt) return null;
    return openpgp.readKeys({ armoredKeys: txt });
  }

  /* ---- wire up --------------------------------------------------------- */
  function showMsgs(msgs) {
    var box = document.getElementById("messages"); box.innerHTML = "";
    msgs.forEach(function (m) {
      var d = document.createElement("div");
      d.className = "msg msg-" + (m.t === "err" ? "err" : m.t === "ok" ? "ok" : "warn");
      d.textContent = m.m; box.appendChild(d);
    });
  }

  document.getElementById("convert").addEventListener("click", async function () {
    var jcard = document.getElementById("jcard").checked;
    var out = document.getElementById("vcfout");
    var keys;
    try { keys = await readCerts(); }
    catch (e) { showMsgs([{ t: "err", m: t("m_parse") + " (" + e.message + ")" }]); return; }
    if (!keys || !keys.length) { showMsgs([{ t: "err", m: t("m_empty") }]); return; }

    var allWarns = [], cards = [], jcards = [];
    for (var i = 0; i < keys.length; i++) {
      var label = "0x" + keys[i].getFingerprint().slice(-16).toUpperCase();
      var r = await keyToVcard(keys[i], label);
      allWarns = allWarns.concat(r.warns);
      cards.push(r.lines.join("\r\n"));
      jcards.push(r.jcard);
    }
    out.value = jcard ? JSON.stringify(jcards.length === 1 ? jcards[0] : jcards, null, 2)
                      : cards.join("\r\n");
    allWarns.push({ t: "ok", m: t("m_done").replace("%n", keys.length) });
    showMsgs(allWarns);
  });

  document.getElementById("download").addEventListener("click", function () {
    var jcard = document.getElementById("jcard").checked;
    var blob = new Blob([document.getElementById("vcfout").value],
      { type: jcard ? "application/json" : "text/vcard;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = jcard ? "contacts.json" : "contacts.vcf";
    a.click(); URL.revokeObjectURL(a.href);
  });

  document.getElementById("copy").addEventListener("click", function () {
    navigator.clipboard.writeText(document.getElementById("vcfout").value)
      .then(function () { showMsgs([{ t: "ok", m: t("m_copied") }]); })
      .catch(function () { showMsgs([{ t: "err", m: t("m_copyerr") }]); });
  });

  // Clear both inputs (pasted text AND loaded file) plus the previous result.
  document.getElementById("clear").addEventListener("click", function () {
    document.getElementById("certtext").value = "";
    document.getElementById("certfile").value = "";
    document.getElementById("vcfout").value = "";
    document.getElementById("messages").innerHTML = "";
    document.getElementById("certtext").focus();
  });

  /* ?src=<relative-cert-url> : the key_index.html "🪪 vCard" button lands here.
   * Fetch the cert (same-origin, relative) into the textarea, then convert. */
  (function () {
    var src = new URLSearchParams(location.search).get("src");
    if (!src) return;
    fetch(src).then(function (r) { return r.ok ? r.text() : Promise.reject(); })
      .then(function (txt) {
        document.getElementById("certtext").value = txt;
        document.getElementById("convert").click();
      }).catch(function () { showMsgs([{ t: "err", m: t("m_parse") }]); });
  })();
})();
</script>
</body>
</html>
