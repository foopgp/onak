				/[\u0800-\uffff]/g, // U+0800 - U+FFFF => 3 bytes 1110xxxx, 10yyyyyy, 10zzzzzz

		function generateudid2() {
			var no_focusing = false; // Set this in json callbacks, so we don't change focus asynchronously from user input
			var to_focus = null;

			var foc = function (id) {
				if (to_focus == null) to_focus = documentElement(id);
			};

			/* MRZ-transliterate(), § 2 de draft-foopgp-urn-eid-00 : décomposer
			   decompose to NFD, strip combining marks (category Mn), upper-case,
			   keep [A-Z] only. Deliberately WITHOUT any national convention:
			   "Muller", not "MUELLER". ICAO 9303 only *recommends* a table, and
			   offers up to three forms per character, so the spec picks one —
			   hence the rebuilt line being shown to the user for review. */
			var mrzTranslit = function (s) {
				return s.normalize("NFD").replace(/\p{Mn}/gu, "")
					.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 32);
			};

			/* Split BEFORE transliterating (§ 4.2.1 step 2): the hyphen stays a
			   component boundary even though it is stripped straight after. */
			var mrzComponents = function (value) {
				return normalizeSpaces(value || "")
					.split(/[^\p{L}\p{N}]+/u)
					.map(mrzTranslit)
					.filter(function (c) { return c !== ""; });
			};

				var parts = mrzComponents(documentElement(id).value);
				if (!parts.length) {
					setMessageAfterElement(id, t_msg.givenNeeded);
					foc(id);
					return null;
				}
				setMessageAfterElement(id);
				return parts[0] + "<" + (parts[1] || "") + "<";
			};

			var checklastname = function (id) {
				var parts = mrzComponents(documentElement(id).value);
				if (!parts.length) {
					setMessageAfterElement(id, t_msg.surnameNeeded);
					foc(id);
					return null;
				}
				setMessageAfterElement(id);
				return parts[parts.length - 1];   // § 4.2.1 : le DERNIER composant
			};

			var firstname = checkfirstname("firstname");
			var lastname = checklastname("lastname");

			// Three controls again. The browser constrains the spin boxes; what
			// is left is completeness, the range the spec cares about, and days
			// that do not exist in that month.
			var date = null;
			var day = documentElement("day").value;
			var month = documentElement("month").value;
			var year = documentElement("year").value;
			var tomorrow = new Date();
			tomorrow.setDate(tomorrow.getDate() + 1);

			if (day === "" || month === "" || year === "") {
				setMessageAfterElement("day", t_msg.incomplete);
				foc(day === "" ? "day" : (month === "" ? "month" : "year"));
			} else if (!/^[0-9]{4}$/.test(year) || year < 1880 || year > tomorrow.getFullYear()) {
				setMessageAfterElement("day",
					t_msg.yearRange.replace("%s", tomorrow.getFullYear()));
				foc("year");
			} else {
				var d = new Date(year, month - 1, day);
				d.setFullYear(year);                       // années < 100
				if (d.getDate() != day || d.getMonth() != month - 1
				    || d.getFullYear() != year || d > tomorrow) {
					setMessageAfterElement("day", t_msg.invalidDate);
					foc("day");
				} else {
					setMessageAfterElement("day");
					date = year + "-" + month + "-" + String(day).padStart(2, "0");
				}
			}

			var ll = countryCoord(documentElement("country").value);
			if (ll === "") {
				setMessageAfterElement("country", t_msg.pickCountry);
				foc("country");
			} else {
				setMessageAfterElement("country");
			}

			if (
				firstname !== null &&
				lastname !== null &&
				ll !== "" &&
				date !== null
			) {
				documentElement("generated").className = "";
				documentElement("tohash").value =
					lastname + "<<" + firstname + date;
				// The country table already stores a full coord14, leading "e"
				// included — do NOT prepend another one. And the standard form
				// glues the variant tag: "u4…", not "udid4=…".
				documentElement("udid4").value =
					"u4" +

						.base64(lastname + "<<" + firstname + date)
						.replace(/[+]/g, "-")

				documentElement("udid4").readOnly = true;
				return true;
			} else {
				documentElement("generated").className = "hidden";
				documentElement("tohash").readOnly = false;
				documentElement("udid4").readOnly = false;
				documentElement("tohash").value = "";
				documentElement("udid4").value = "";

					}
				}

			}

			function translatePage(lang) {
				const t = translations[lang];
				if (!t) return;

				document.title = t.title;
				document.documentElement.lang = lang;
				document.getElementById("t_title").textContent = t.title;
				document.querySelector("h3").textContent = t.yourInformation;
				// Labels carry ids now — no more addressing them by <td> position.
				document.getElementById("t_lbl_surname").textContent = t.surname;
				document.getElementById("t_lbl_given").textContent = t.givenNames;
				document.getElementById("t_lbl_date").textContent = t.birthDate;
				document.getElementById("t_lbl_place").textContent = t.birthplace;

				// Spin box hints, month names and country list follow the language.
				document.getElementById("day").placeholder = t.dayPh;
				document.getElementById("year").placeholder = t.yearPh;
				const mopts = document.getElementById("month").options;
				mopts[0].textContent = t.monthPh;
				monthNames(lang).forEach((m, i) => { mopts[i + 1].textContent = m; });
				buildCountryList(lang);
				document.getElementById("country").placeholder = countryExample(lang);
				t_msg = t;
				document.getElementById("reset").value = t.reset;
				document.getElementById("generate").value = t.generate;
				document.getElementById("t_udidinfo").textContent = t.udidInfo;
				document.getElementById("t_btncopy").textContent = t.copy;
				document.getElementById("t_mrzcheck").textContent = t.mrzCheck;

				/* Tooltips. Every control already has a <label for> or visible
				   text, so "title" is announced as its DESCRIPTION by screen
				   readers rather than taken for its name. */
				const tips = {
					language: t.tipLang, lastname: t.tipSurname, firstname: t.tipGiven,
					day: t.tipDate, month: t.tipDate, year: t.tipDate,
					country: t.tipCountry, reset: t.tipReset, generate: t.tipGenerate,
					tohash: t.tipMrz, t_mrzcheck: t.tipMrz, udid4: t.tipResult,
					t_btncopy: t.tipCopy, urn: t.tipUrn,
				};
				for (const id in tips) {
					const el = document.getElementById(id);
					if (el && tips[id]) el.title = tips[id];
				}

				const f = footerI18n[lang] || footerI18n.en;
				const base = (lang === "fr") ? "https://foopgp.org/fr/" : "https://foopgp.org/";
				const lmEl = document.getElementById("learnmore");
				if (lmEl) {
					lmEl.innerHTML =
						'<a href="../?lang=' + lang + '">' + f.another + '</a>' +
						' \u00a0\u00b7\u00a0 <a href="https://foopgp.org/documents/en/draft-foopgp-urn-eid-00.txt">' + f.spec + '</a>' +
						' \u00a0\u00b7\u00a0 <a href="' + base + '">foopgp.org</a>';
				}
			}

			/* ?lang=it wins over the browser, so a link can carry its language. */
			function pickLang() {
				const norm = s => {
					const c = (s || "").slice(0, 2).toLowerCase();
					return translations[c] ? c : "";
				};
				const url = norm(new URLSearchParams(location.search).get("lang"));
				if (url) return url;
				for (const l of (navigator.languages || [navigator.language || "en"])) {
					const c = norm(l);
					if (c) return c;
				}
				return "en";
			}

			const lang = pickLang();
			document.getElementById("language").value = lang;
			translatePage(lang);

			document
				.getElementById("language")
				.addEventListener("change", (event) => {
					translatePage(event.target.value);
				});
		});

		/* Country and month names come from the browser's own CLDR data
		   (Intl.*), not from a table we would have to translate nine times and
		   keep up to date. The alpha-2 code (4th column) is what Intl wants;
		   the alpha-3 stays visible because it is what the spec uses. */
		const regionNames = lang => {
			try { return new Intl.DisplayNames([lang], { type: "region" }); }
			catch (e) { return null; }
		};

		function monthNames(lang) {
			try {
				const f = new Intl.DateTimeFormat(lang, { month: "long" });
				return Array.from({ length: 12 }, (_, i) => {
					const n = f.format(new Date(2001, i, 15));
					return n.charAt(0).toUpperCase() + n.slice(1);
				});
			} catch (e) {
				return ["01","02","03","04","05","06","07","08","09","10","11","12"];
			}
		}

		let countryByLabel = {};
		let t_msg = {};   // messages de la langue courante, lus par generateudid2()

		/* Rebuilds the <datalist> and the reverse map in the page language.
		   The lookup keeps accepting the English name, the alpha-3 and the
		   alpha-2, so a link or a habit never breaks on a language switch. */
		function buildCountryList(lang) {
			const dn = regionNames(lang);
			const label = c => (dn ? dn.of(c[3]) || c[0] : c[0]) + " (" + c[1] + ")";
			countryByLabel = {};
			const sorted = countries.slice().sort(
				(a, b) => label(a).localeCompare(label(b), lang));
			const dl = documentElement("countrylist");
			emptyElement(dl);
			for (const c of sorted) {
				const l = label(c);
				countryByLabel[l.toLowerCase()] = c[2];
				countryByLabel[l.replace(/ \([A-Z]{3}\)$/, "").toLowerCase()] = c[2];
				countryByLabel[c[0].toLowerCase()] = c[2];   // English name
				countryByLabel[c[1].toLowerCase()] = c[2];   // ISO 3166-1 alpha-3
				countryByLabel[c[3].toLowerCase()] = c[2];   // ISO 3166-1 alpha-2
				const o = document.createElement("option");
				o.value = l;
				dl.appendChild(o);
			}
		}

		/* Input hint: a real country, in the page language, to show the
		   expected "Name (ISO3)" shape. */
		function countryExample(lang) {
			const dn = regionNames(lang);
			return (dn ? dn.of("FR") || "France" : "France") + " (FRA)";
		}

		function copyOut() {
			const el = documentElement("udid4");
			el.select();
			if (navigator.clipboard) navigator.clipboard.writeText(el.value);
			else document.execCommand("copy");
			const b = documentElement("t_btncopy"), old = b.textContent;
			b.textContent = t_msg.copied || "Copied";
			setTimeout(() => { b.textContent = old; }, 1200);
		}

		function countryCoord(value) {
			const v = normalizeSpaces(value || "").toLowerCase();
			return countryByLabel[v] || "";
		}
	</script>
</body>

</html>
