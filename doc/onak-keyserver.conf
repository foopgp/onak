# onak key server — Apache 2 virtual host.
#
# Installed by the package as /etc/apache2/sites-available/onak-keyserver.conf.
# To turn it on:
#
#	a2enmod cgi
#	echo 'Listen 11371' >> /etc/apache2/ports.conf   # the HKP port
#	a2ensite onak-keyserver
#	apache2ctl configtest && systemctl reload apache2
#
# suexec must NOT be enabled: it refuses to run the programs in
# /usr/lib/cgi-bin/pks. Remove suexec.load from mods-enabled if it is there.
#
# For TLS on 443, copy the three blocks below into your existing SSL virtual
# host rather than duplicating this file — the aliases are what matters, the
# certificate is your own business.

<VirtualHost *:11371>
	DocumentRoot /var/www/onak

	# The CGI endpoints, named one by one — deliberately.
	#
	# A blanket "ScriptAlias /pks /usr/lib/cgi-bin/pks" captures the whole
	# /pks/ URL space, so /pks/index.html would be looked for among the
	# programs and never served: the search page is a page, not a program.
	# Naming the four endpoints leaves everything else under /pks/ to the
	# document root, which is where the pages live.
	ScriptAlias /pks/lookup    /usr/lib/cgi-bin/pks/lookup
	ScriptAlias /pks/add       /usr/lib/cgi-bin/pks/add
	ScriptAlias /pks/gpgwww    /usr/lib/cgi-bin/pks/gpgwww
	ScriptAlias /pks/hashquery /usr/lib/cgi-bin/pks/hashquery

	<Directory /var/www/onak>
		Options -Indexes
		Require all granted
	</Directory>

	<Directory /usr/lib/cgi-bin/pks>
		Require all granted
	</Directory>

	CustomLog /var/log/apache2/keyserver-access.log combined
	ErrorLog /var/log/apache2/keyserver-error.log
</VirtualHost>
