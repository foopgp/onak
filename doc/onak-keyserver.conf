# Apache 2 configuration for onak pgp keyserver
#
# Current file should be installed in /etc/apache2/sites-available/onak-keyserver.conf
#
# To enable onak pgp keyserver :
#
#	1) Enable apache2 cgi mod (if not already):
#	   $ sudo a2enmod cgi
#
#	2) apache2 suexec refuses to run the programs in /usr/lib/cgi-bin/pks/ ; so make sure suexec is disabled:
#	   $ sudo a2dismod suexec
#
#	3) edit the /etc/apache2/ports.conf file and add 'Listen 11371' (the HKP default port)
#
#	4) check that VirtualHost directive in /etc/apache2/sites-available/*default.conf only play with port 80
#
#	5) enable this onak-keyserver configuration
#	   $ a2ensite onak-keyserver
#
#	6) $ apache2ctl configtest && systemctl reload apache2
#
# Note: if you enable TLS (https, port 443) with certbot, you SHOULD comment the 'Rewrite…" directives
# certbot use to include inside non https (*:443) VirtualHost, like in this current file.

<VirtualHost *:11371>
	DocumentRoot /var/www/onak

	# The CGI endpoints, named one by one to reduce attack surface and allow static page /pks/index.html
	# HKP interfaces
	ScriptAlias /pks/lookup    /usr/lib/cgi-bin/pks/lookup
	ScriptAlias /pks/add       /usr/lib/cgi-bin/pks/add
	# Web of Trust pathfinder:
	ScriptAlias /pks/gpgwww    /usr/lib/cgi-bin/pks/gpgwww
	# Reconciliation with other key servers, SKS style. (define peers to sync with in /etc/onak.ini)
	#ScriptAlias /pks/hashquery /usr/lib/cgi-bin/pks/hashquery

	<Directory /var/www/onak>
		Options -Indexes
		Require all granted
	</Directory>

	<Directory /usr/lib/cgi-bin/pks>
		Require all granted
	</Directory>

	CustomLog /var/log/apache2/keyserver-access.log combined
	ErrorLog /var/log/apache2/keyserver-error.log
</VirtualHost>
